{% extends "base.html" %}

{% block title %}Customer Login - TrustGuard AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center auth-container">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="auth-icon-wrap mb-3 mx-auto">
                        <i class="bi bi-shield-lock fs-2 text-primary-accent"></i>
                    </div>
                    <h3 class="fw-bold text-navy mb-1">Customer Login</h3>
                    <p class="text-muted small">Sign in to access your secure financial account</p>
                </div>

                <div id="loginFeedback"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium text-secondary small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-medium text-secondary small mb-0">Password</label>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2" id="loginSubmitBtn">
                        <span>Sign In</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">Don't have an account yet? 
                        <a href="{{ url_for('customer.register_page') }}" class="text-primary-accent fw-semibold text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/customer.js') }}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initCustomerLogin();
    });
</script>
{% endblock %}
